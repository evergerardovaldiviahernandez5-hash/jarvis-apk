name: Build Nova Windows EXE
on:
  workflow_dispatch:
concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-glfw

      - name: Clone dependencies
        shell: msys2 {0}
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          git clone https://github.com/ocornut/imgui.git
          # AHORA SÍ DESCARGAMOS GLFW
          git clone https://github.com/glfw/glfw.git

      - name: Build Nova (Compatible)
        shell: msys2 {0}
        run: |
          cd Windows
          mkdir -p build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=x86-64" \
            -DCMAKE_CXX_FLAGS="-march=x86-64" \
            -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_F16C=OFF -DGGML_FMA=OFF \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENMP=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          mingw32-make -j2

      - name: Package ONLY the EXE
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp Windows/build/Nova.exe dist/
          cd dist
          zip -r ../Nova-Windows-EXE.zip Nova.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows-EXE
          path: Nova-Windows-EXE.zip
