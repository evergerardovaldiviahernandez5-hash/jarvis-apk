name: Build Nova APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMGR=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find $SDK_ROOT -name sdkmanager -type f | head -1)
          fi
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Cache llama.cpp
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-v5-${{ runner.os }}

      - name: Clone llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          rm -rf llama.cpp
          for i in 1 2 3; do
            echo "Intento $i..."
            if git clone --depth 1 https://github.com/ggml-org/llama.cpp.git; then
              echo "✅ Clone exitoso"
              exit 0
            fi
            echo "❌ Falló. Esperando 10s..."
            sleep 10
            rm -rf llama.cpp
          done
          echo "❌ Todos los intentos fallaron"
          exit 1

      - name: Build llama-server for arm64-v8a
        run: |
          cd llama.cpp
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_RPC=ON \
            -DCMAKE_BUILD_TYPE=Release
          # Detectar nombre del target RPC (rpc-server o ggml-rpc-server)
          RPC_TARGET="rpc-server"
          if cmake --build build-arm64 --target help 2>/dev/null | grep -q "ggml-rpc-server"; then
            RPC_TARGET="ggml-rpc-server"
          fi
          echo "RPC target detectado: $RPC_TARGET"
          cmake --build build-arm64 -j$(nproc) --target llama-server $RPC_TARGET

      - name: Build llama-server for armeabi-v7a
        run: |
          cd llama.cpp
          cmake -B build-armv7 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_ARM_NEON=ON \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_C_FLAGS="-mfloat-abi=softfp -mfpu=neon-vfpv4" \
            -DCMAKE_CXX_FLAGS="-mfloat-abi=softfp -mfpu=neon-vfpv4" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_CPU_ARM_ARCH=armv7-a \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_RPC=ON \
            -DCMAKE_BUILD_TYPE=Release
          RPC_TARGET="rpc-server"
          if cmake --build build-armv7 --target help 2>/dev/null | grep -q "ggml-rpc-server"; then
            RPC_TARGET="ggml-rpc-server"
          fi
          cmake --build build-armv7 -j$(nproc) --target llama-server $RPC_TARGET

      - name: Copy binaries to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a

          # --- llama-server (obligatorio) ---
          cp llama.cpp/build-arm64/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so
          cp llama.cpp/build-armv7/bin/llama-server app/src/main/jniLibs/armeabi-v7a/libllama_server.so
          echo "✅ llama-server copiado"

          # --- rpc-server arm64 (opcional) ---
          RPC_ARM64=""
          [ -f llama.cpp/build-arm64/bin/rpc-server ] && RPC_ARM64="llama.cpp/build-arm64/bin/rpc-server"
          [ -z "$RPC_ARM64" ] && [ -f llama.cpp/build-arm64/bin/ggml-rpc-server ] && RPC_ARM64="llama.cpp/build-arm64/bin/ggml-rpc-server"
          if [ -n "$RPC_ARM64" ]; then
            cp "$RPC_ARM64" app/src/main/jniLibs/arm64-v8a/librpc_server.so
            echo "✅ rpc-server arm64 copiado desde $RPC_ARM64"
          else
            echo "⚠️ rpc-server arm64 NO se compiló (se omite)"
          fi

          # --- rpc-server armv7 (opcional) ---
          RPC_ARMV7=""
          [ -f llama.cpp/build-armv7/bin/rpc-server ] && RPC_ARMV7="llama.cpp/build-armv7/bin/rpc-server"
          [ -z "$RPC_ARMV7" ] && [ -f llama.cpp/build-armv7/bin/ggml-rpc-server ] && RPC_ARMV7="llama.cpp/build-armv7/bin/ggml-rpc-server"
          if [ -n "$RPC_ARMV7" ]; then
            cp "$RPC_ARMV7" app/src/main/jniLibs/armeabi-v7a/librpc_server.so
            echo "✅ rpc-server armv7 copiado desde $RPC_ARMV7"
          else
            echo "⚠️ rpc-server armv7 NO se compiló (se omite)"
          fi

          echo ""
          echo "=== Contenido jniLibs ==="
          ls -la app/src/main/jniLibs/arm64-v8a/ || true
          ls -la app/src/main/jniLibs/armeabi-v7a/ || true


      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "Tamaño: $(du -h $APK | cut -f1)"
          SDK_ROOT=/usr/local/lib/android/sdk
          $SDK_ROOT/build-tools/34.0.0/aapt dump badging $APK | grep -E "package:|sdkVersion|targetSdk|native-code"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
