name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-${{ runner.os }}-v1

      - name: Clone llama.cpp
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Build llama-server for Android arm64
        run: |
          cd llama.cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --config Release -j$(nproc) --target llama-server

      - name: Copy binary to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp llama.cpp/build-android/bin/llama-server \
             app/src/main/jniLibs/arm64-v8a/libllama_server.so
          # Copiar .so adicionales si el build los generó
          find llama.cpp/build-android/bin -name "*.so" \
             -exec cp {} app/src/main/jniLibs/arm64-v8a/ \; 2>/dev/null || true
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Jarvis.apk
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: out/Jarvis.apk
          retention-days: 30
